name: Test repository spelling check
on:
    push:
        branches:
          - main
    pull_request:
        branches:
          - main
    workflow_dispatch:

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v7

    - name: Check the actual checked-in contributor and README documents
      uses: crate-ci/typos@v1.51.1
      with:
        files: ./CONTRIBUTING.md ./README.md
