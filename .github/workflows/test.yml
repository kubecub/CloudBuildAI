name: Test Makefile build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Test the actual logger, formatter, Writer and CLI contracts
        run: go test -race -mod=readonly -count=1 -timeout=60s ./...
      - name: Build both actual commands with the project Makefile
        run: make build
      - name: Read the real version command without calling an AI provider
        shell: bash
        run: |
          test -x bin/platforms/linux/amd64/chat
          bin/platforms/linux/amd64/gpt version --output=json > "$RUNNER_TEMP/version.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'version.json').read_text())
          assert data['kubecubVersion']['gitVersion']
          assert data['kubecubVersion']['goVersion'].startswith('go1.26.')
          PYCODE
      - name: Detect the old Writer regression without changing the tested source
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/logrus-regression"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/logrus-regression"
          cd "$RUNNER_TEMP/logrus-regression"
          go mod edit -require=github.com/sirupsen/logrus@v1.9.1
          go mod tidy
          set +e
          go test -count=1 -run '^TestWriterContract$/^lines$' -timeout=15s ./pkg/log > "$RUNNER_TEMP/logrus-regression.log" 2>&1
          regression_status=$?
          set -e
          if [ "$regression_status" -eq 0 ]; then
            cat "$RUNNER_TEMP/logrus-regression.log"
            echo 'Old Writer regression was not detected'
            exit 1
          fi
          grep -Eq -- '--- FAIL: TestWriterContract|panic: runtime error|Writer .*timed out' "$RUNNER_TEMP/logrus-regression.log"
